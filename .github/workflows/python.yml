name: Python tests
on:
  push:
    paths:
      - 'contracts/**'
      - 'requirements.txt'
      - 'simulator/**'
      - 'simulator_app.py'
      - '.streamlit/**'
      - 'requirements-ui.txt'
      - 'requirements-desktop.txt'
      - 'tests/**'
      - 'scripts/*.py'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'requirements.txt'
      - 'simulator/**'
      - 'simulator_app.py'
      - '.streamlit/**'
      - 'requirements-ui.txt'
      - 'requirements-desktop.txt'
      - 'tests/**'
      - 'scripts/*.py'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries for headless tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt -r requirements-ui.txt -r requirements-desktop.txt
      - run: python -m pytest -q
